[project]
name = "coach-fingerprint"
version = "0.1.0"
description = "Turn tactical claims about coaches into measurable metrics from free event data"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "requests", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
